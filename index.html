<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <h2 class="logo">MyProSite</h2>
    <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Cards</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
        <li><button id="toggleMode">🌙</button></li>
    </ul>
</nav>

<!-- Hero Section -->
<section class="hero">
    <h1>Welcome to My Website</h1>
    <p>Learn Professional HTML and CSS</p>
    <button class="hero-btn">Get Started</button>
</section>

<!-- Cards Section -->
<section class="cards">
    <div class="card">
        <h1>Web Design</h1>
    <p>Modern UI/UX designs</p>
    </div>
    <div class="card">
        <h1>Development</h1>
    <p>Front end and Backend</p>
    </div>
    <div class="card">
    <h1>SEO</h1>
    <p>Boost Website Ranking</p>
    </div>
</section>

<!-- Gallery -->
<section class="gallery">
    <img src="Images/ai 2.png" height="100">
    <img src="Images/labs.jpg" height="100">
    <img src="Images/html.jpg" height="100">
</section>

<!-- Form -->
<section class="form-section">
    <form>
        <input type="text" placeholder="Enter Name"><br>
        <input type="email" placeholder="Enter Email"><br>
        <textarea placeholder="Message"></textarea><br>
        <button type="submit">Submit</button>
    </form>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 My Website | All Rights Reserved</p>
</footer>
<script>
const button = document.getElementById("toggleMode");

button.onclick = function () {
    document.body.classList.toggle("dark");

    // Change icon
    if (document.body.classList.contains("dark")) {
        button.textContent = "☀️";
    } else {
        button.textContent = "🌙";
    }
};
</script>
</body>
</html>
